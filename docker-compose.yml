version: "3.9"

services:
  backend:
    build: ./backend
    image: superkart-backend
    container_name: superkart-backend
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models:ro   # mount the serialised model
    environment:
      - MODEL_PATH=models/best_model.pkl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    image: superkart-frontend
    container_name: superkart-frontend
    ports:
      - "8501:7860"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
